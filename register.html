
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Stay Awhile</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js" defer></script>
    <script src="validation.js" defer></script>
    <script src="chatbot.js" defer></script>
</head>
<body class="auth-page">

<header class="navbar">
    <a href="index.html" class="logo">stay<span>awhile.</span></a>
    <div class="nav-actions">
        <a href="index.html" class="nav-login">Home</a>
        <button class="theme-toggle" aria-label="Toggle theme">☾</button>
    </div>
</header>

<main class="auth-container">
    <section class="auth-card">
        <p class="eyebrow">BECOME A MEMBER</p>
        <h1>Let's get to know you.</h1>
        <p class="auth-subtitle">Create your Stay Awhile profile.</p>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <span class="error-msg" id="fullNameError"></span>
            </div>

            <div class="form-group">
                <label for="empId">Employee / Register ID</label>
                <input type="text" id="empId" placeholder="Example: SA123456">
                <span class="error-msg" id="empIdError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
                <span class="error-msg" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="10-digit mobile number">
                <span class="error-msg" id="mobileError"></span>
            </div>

            <div class="form-group">
                <label for="dept">Division</label>
                <select id="dept">
                    <option value="">Select your division</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="ISE">Information Science</option>
                    <option value="ECE">Electronics and Communication</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="Other">Other</option>
                </select>
                <span class="error-msg" id="deptError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password">
                <span class="error-msg" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                <span class="error-msg" id="confirmPasswordError"></span>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-dark btn-full" disabled>
                Create my account ↗
            </button>
        </form>

        <p class="auth-bottom">
            Already a member? <a href="signin.html">Sign in</a>
        </p>
    </section>
</main>

<footer class="footer">
    <p>© 2026 Stay Awhile.</p>
</footer>

</body>
</html>
