
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Stay Awhile</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/theme.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/chatbot.js" defer></script>
</head>
<body class="auth-page">

<header class="navbar">
    <a href="index.html" class="logo">stay<span>awhile.</span></a>
    <div class="nav-actions">
        <a href="index.html" class="nav-login">Home</a>
        <button class="theme-toggle" aria-label="Toggle theme">☾</button>
    </div>
</header>

<main class="auth-container">
    <section class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Good to have you here.</h1>
        <p class="auth-subtitle">Sign in to continue your journey.</p>

        <div id="signinMessage" class="form-alert" role="alert"></div>

        <form id="signinForm" novalidate>
            <div class="form-group">
                <label for="signinEmail">Email Address</label>
                <input type="email" id="signinEmail" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="signinPassword">Password</label>
                <div class="password-wrap">
                    <input type="password" id="signinPassword" placeholder="Enter your password" required>
                    <button type="button" id="togglePassword" class="eye-btn" aria-label="Show password">◉</button>
                </div>
            </div>

            <button type="submit" class="btn btn-dark btn-full">
                Sign in ↗
            </button>
        </form>

        <p class="auth-bottom">
            New here? <a href="signup.html">Create an account</a>
        </p>

        <p class="auth-bottom">
            Want a detailed profile? <a href="register.html">Register here</a>
        </p>
    </section>
</main>

<footer class="footer">
    <p>© 2026 Stay Awhile.</p>
</footer>

</body>
</html>
